<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elenco Operatori - AUSER Asti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="responsive-app.css">
    <link rel="stylesheet" href="elencooperatori.css">
</head>
<body>
    <div class="container-fluid soci-container">
        <div class="page-header-wrapper">
            <div class="page-title-row">
                <div class="page-header-left">
                    <button type="button" class="btn btn-filtra-mansioni" id="btn-filtra-mansioni" title="Filtra per mansioni">FILTRA MANSIONI</button>
                </div>
                <div class="page-title-center">
                    <h1 class="page-title">ELENCO OPERATORI <span id="operatori-count" style="font-size: 0.8em; color: #666;">(0)</span></h1>
                    <button class="btn-icon-search" id="btn-show-search" title="Cerca">
                        <span class="icon-search">🔍</span>
                    </button>
                    <div class="search-container" id="search-container" style="display: none;">
                        <input type="text" id="search-input" class="search-input" placeholder="Cerca per nominativo...">
                        <button class="btn-icon-close" id="btn-hide-search" title="Chiudi ricerca">
                            <span class="icon-close">✕</span>
                        </button>
                    </div>
                </div>
                <div class="page-header-actions">
                    <button type="button" class="btn btn-filtro-attivi" id="btn-filtro-attivi" title="Mostra solo operatori attivi" aria-pressed="false">ATTIVI</button>
                    <button type="button" class="btn btn-chilometri-totali" id="btn-chilometri-totali" title="Chilometri di tutti gli operatori">CHILOMETRI TOTALI</button>
                    <button type="button" class="btn btn-chiudi" id="btn-chiudi">CHIUDI</button>
                </div>
            </div>
        </div>
        
        <!-- Container scrollabile con tutti gli operatori -->
        <div class="soci-container-scrollabile" id="soci-container-body">
            <div class="soci-lista-loading">Caricamento operatori...</div>
        </div>
    </div>

    <!-- Modale filtro mansioni -->
    <div id="modal-filtra-mansioni" class="op-modal-overlay" hidden aria-hidden="true">
        <div class="op-modal" role="dialog" aria-labelledby="modal-filtra-mansioni-title" aria-modal="true">
            <div class="op-modal-header">
                <h2 id="modal-filtra-mansioni-title">Filtra per mansioni</h2>
                <button type="button" class="op-modal-close" id="btn-filtra-mansioni-chiudi" title="Chiudi" aria-label="Chiudi">&times;</button>
            </div>
            <p class="op-modal-intro">
                Spunta le mansioni da mostrare. Se non ne selezioni nessuna, vedi tutti gli operatori.
                L’elenco delle caselle viene preso da Impostazioni → Mansioni.
            </p>
            <div id="filtra-mansioni-lista" class="op-modal-flags">
                <p class="op-modal-empty">Caricamento mansioni…</p>
            </div>
            <div class="op-modal-actions">
                <button type="button" class="btn btn-filtra-mansioni-azzera" id="btn-filtra-mansioni-azzera">AZZERA FILTRO</button>
                <button type="button" class="btn btn-filtra-mansioni-ok" id="btn-filtra-mansioni-ok">CHIUDI</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="elencooperatori.js"></script>
</body>
</html>
