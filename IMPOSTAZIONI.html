<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impostazioni - AUSER Asti</title>
    <link rel="stylesheet" href="impostazioni.css">
</head>
<body>
    <div class="imp-app">
        <header class="imp-header">
            <h1 class="imp-title">IMPOSTAZIONI</h1>
            <div class="imp-header-actions">
                <button type="button" class="imp-btn imp-btn-aggiungi" id="btn-aggiungi" hidden>AGGIUNGI</button>
                <button type="button" class="imp-btn imp-btn-salva" id="btn-salva">SALVA</button>
                <button type="button" class="imp-btn imp-btn-chiudi" id="btn-chiudi">CHIUDI</button>
            </div>
        </header>

        <nav class="imp-tabs" role="tablist" aria-label="Sezioni impostazioni">
            <button type="button" class="imp-tab is-active" role="tab" aria-selected="true" data-tab="impostazioni">Impostazioni</button>
            <button type="button" class="imp-tab" role="tab" aria-selected="false" data-tab="richiedenti">Richiedenti</button>
            <button type="button" class="imp-tab" role="tab" aria-selected="false" data-tab="tipo_socio">Tipologie socio</button>
            <button type="button" class="imp-tab" role="tab" aria-selected="false" data-tab="motivazioni_trasporto">Motivazioni</button>
            <button type="button" class="imp-tab" role="tab" aria-selected="false" data-tab="tipo_pagamenti">Tipi pagamento</button>
        </nav>

        <p class="imp-intro" id="imp-intro">Modifica i valori della tabella Impostazioni, poi premi SALVA.</p>
        <p class="imp-status" id="imp-status" hidden></p>

        <!-- Scheda Impostazioni (chiave / valore) -->
        <section class="imp-panel" id="panel-impostazioni" data-panel="impostazioni">
            <div class="imp-loading" id="imp-loading">Caricamento impostazioni...</div>
            <div class="imp-errore" id="imp-errore" hidden></div>
            <div class="imp-vuoto" id="imp-vuoto" hidden>Nessuna impostazione trovata.</div>
            <div class="imp-lista" id="imp-lista" hidden></div>
        </section>

        <!-- Schede lookup (Richiedenti, Tipologie, Motivazioni, Tipi pagamento) -->
        <section class="imp-panel" id="panel-lookup" data-panel="lookup" hidden>
            <div class="imp-loading" id="lk-loading" hidden>Caricamento elenco...</div>
            <div class="imp-errore" id="lk-errore" hidden></div>
            <div class="imp-vuoto" id="lk-vuoto" hidden>Nessun valore in questa tabella.</div>
            <div class="imp-lookup-lista" id="lk-lista" hidden></div>
        </section>
    </div>

    <!-- Modale aggiungi / modifica valore lookup -->
    <div class="imp-modal" id="modal-lookup" hidden>
        <div class="imp-modal-card" role="dialog" aria-labelledby="modal-lookup-title">
            <h2 id="modal-lookup-title">Valore</h2>
            <input type="hidden" id="lk-edit-id">
            <div class="imp-field">
                <label for="lk-edit-valore" id="lk-edit-label">Valore</label>
                <input type="text" id="lk-edit-valore" autocomplete="off">
            </div>
            <div class="imp-modal-azioni">
                <button type="button" class="imp-btn imp-btn-salva" id="btn-lk-salva">SALVA</button>
                <button type="button" class="imp-btn imp-btn-chiudi" id="btn-lk-annulla">ANNULLA</button>
            </div>
        </div>
    </div>

    <!-- Conferma eliminazione -->
    <div class="imp-modal" id="modal-conferma-elimina" hidden>
        <div class="imp-modal-card imp-modal-card-conferma" role="dialog" aria-labelledby="modal-conferma-title">
            <h2 id="modal-conferma-title">Eliminare?</h2>
            <p class="imp-conferma-testo" id="modal-conferma-testo">
                Sei sicuro di voler eliminare questo valore? L'operazione non si può annullare.
            </p>
            <div class="imp-modal-azioni imp-modal-azioni-conferma">
                <button type="button" class="imp-btn imp-btn-elimina" id="btn-conferma-si">SÌ, ELIMINA</button>
                <button type="button" class="imp-btn imp-btn-chiudi" id="btn-conferma-no">NO, ANNULLA</button>
            </div>
        </div>
    </div>

    <script type="module" src="impostazioni.js"></script>
</body>
</html>
